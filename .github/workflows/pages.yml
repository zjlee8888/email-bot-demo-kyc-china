name: Deploy demo to GitHub Pages

on:
  push:
    branches: ["claude/email-mailbox-demo-bb5ker"]
  workflow_dispatch:

# Least privilege needed to publish Pages from an artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns Pages on for this repo, so no manual
        # Settings -> Pages step is needed for the first deploy.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        # The demo is a single self-contained index.html at the repo root,
        # so the whole root is the site. .nojekyll keeps Pages from
        # running it through Jekyll.
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
