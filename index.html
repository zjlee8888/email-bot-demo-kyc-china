<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYC Desk — Email Agent Walkthrough</title>
<meta name="description" content="Interactive demo: a compliance analyst requests PRC due diligence in plain-English email. The agent highlights what it parsed, then returns a person screening inline or a company file as an encrypted Excel workbook.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2B5F8E">
<!-- ARTIFACT:STYLE:BEGIN -->
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root {
  color-scheme: light dark;

  --paper:      #E9EDF2;
  --surface:    #FFFFFF;
  --surface-2:  #F4F6F9;
  --surface-3:  #E4E9EF;
  --border:     #D2DAE3;
  --border-2:   #BFC9D5;
  --ink:        #131A22;
  --ink-2:      #46535F;
  --ink-3:      #6D7A88;

  --accent:     #2B5F8E;
  --accent-2:   #24506F;
  --accent-soft:#DCE7F1;

  --seal:       #A8342A;
  --seal-soft:  #F6E3E0;
  --ok:         #1F6F5C;
  --ok-soft:    #DCEDE7;
  --warn:       #9A6410;
  --warn-soft:  #F6EBD7;

  /* parsed-request slot categories */
  --slot-entity:#2B5F8E; --slot-entity-bg:#DCE7F1;
  --slot-id:    #6B3FA0; --slot-id-bg:    #E7DFF2;
  --slot-scope: #1F6F5C; --slot-scope-bg: #DAEDE6;
  --slot-out:   #9A6410; --slot-out-bg:   #F7EAD4;

  --shadow-1: 0 1px 2px rgba(19,26,34,.06), 0 1px 1px rgba(19,26,34,.04);
  --shadow-2: 0 8px 24px rgba(19,26,34,.10), 0 2px 6px rgba(19,26,34,.06);

  --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Songti SC", serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;

  --rail-w: 188px;
  --list-w: 300px;
  --trace-w: 330px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:      #0D1218;
    --surface:    #151C24;
    --surface-2:  #1B242E;
    --surface-3:  #232E39;
    --border:     #2A3742;
    --border-2:   #3A4956;
    --ink:        #E4EAF1;
    --ink-2:      #A7B4C1;
    --ink-3:      #7B8896;

    --accent:     #7BA9D4;
    --accent-2:   #A3C4E3;
    --accent-soft:#1D2E3E;

    --seal:       #E08D82;
    --seal-soft:  #34201E;
    --ok:         #6FC0A8;
    --ok-soft:    #16302A;
    --warn:       #D9A55C;
    --warn-soft:  #322613;

    --slot-entity:#7BA9D4; --slot-entity-bg:#1D2E3E;
    --slot-id:    #B79BE0; --slot-id-bg:    #262038;
    --slot-scope: #6FC0A8; --slot-scope-bg: #16302A;
    --slot-out:   #D9A55C; --slot-out-bg:   #322613;

    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 10px 30px rgba(0,0,0,.5);
  }
}

:root[data-theme="dark"] {
  --paper:#0D1218; --surface:#151C24; --surface-2:#1B242E; --surface-3:#232E39;
  --border:#2A3742; --border-2:#3A4956; --ink:#E4EAF1; --ink-2:#A7B4C1; --ink-3:#7B8896;
  --accent:#7BA9D4; --accent-2:#A3C4E3; --accent-soft:#1D2E3E;
  --seal:#E08D82; --seal-soft:#34201E; --ok:#6FC0A8; --ok-soft:#16302A; --warn:#D9A55C; --warn-soft:#322613;
  --slot-entity:#7BA9D4; --slot-entity-bg:#1D2E3E;
  --slot-id:#B79BE0; --slot-id-bg:#262038;
  --slot-scope:#6FC0A8; --slot-scope-bg:#16302A;
  --slot-out:#D9A55C; --slot-out-bg:#322613;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 10px 30px rgba(0,0,0,.5);
}

:root[data-theme="light"] {
  --paper:#E9EDF2; --surface:#FFFFFF; --surface-2:#F4F6F9; --surface-3:#E4E9EF;
  --border:#D2DAE3; --border-2:#BFC9D5; --ink:#131A22; --ink-2:#46535F; --ink-3:#6D7A88;
  --accent:#2B5F8E; --accent-2:#24506F; --accent-soft:#DCE7F1;
  --seal:#A8342A; --seal-soft:#F6E3E0; --ok:#1F6F5C; --ok-soft:#DCEDE7; --warn:#9A6410; --warn-soft:#F6EBD7;
  --slot-entity:#2B5F8E; --slot-entity-bg:#DCE7F1;
  --slot-id:#6B3FA0; --slot-id-bg:#E7DFF2;
  --slot-scope:#1F6F5C; --slot-scope-bg:#DAEDE6;
  --slot-out:#9A6410; --slot-out-bg:#F7EAD4;
  --shadow-1: 0 1px 2px rgba(19,26,34,.06), 0 1px 1px rgba(19,26,34,.04);
  --shadow-2: 0 8px 24px rgba(19,26,34,.10), 0 2px 6px rgba(19,26,34,.06);
}

/* ============================================================
   Base
   ============================================================ */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  display: grid;
  /* minmax(0,1fr): an auto track cannot shrink below its items' min-content,
     which would let the brand bar push the whole page into a sideways scroll. */
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  height: 100dvh;
  min-height: 0;
}

/* ============================================================
   Brand bar
   ============================================================ */
.brandbar {
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.mark {
  display: grid; place-items: center;
  width: 26px; height: 26px; flex: none;
  border-radius: 5px;
  background: var(--accent); color: #fff;
  font-family: var(--serif); font-size: 14px; font-weight: 600;
  letter-spacing: .02em;
}
:root[data-theme="dark"] .mark, :root:not([data-theme]) .mark { }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mark { color: #0D1218; } }
:root[data-theme="dark"] .mark { color: #0D1218; }
:root[data-theme="light"] .mark { color: #fff; }

.brandname { font-weight: 640; letter-spacing: -.01em; min-width: 0; }
.brandsub {
  color: var(--ink-3); font-size: 12px;
  padding-left: 14px; margin-left: 2px;
  border-left: 1px solid var(--border);
}
.brandbar .spacer { flex: 1; }

.seg {
  display: flex; gap: 2px; padding: 2px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 7px;
}
.seg button {
  border: 0; background: transparent; cursor: pointer;
  padding: 5px 11px; border-radius: 5px;
  font-size: 12.5px; font-weight: 560; color: var(--ink-2);
  white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] {
  background: var(--surface); color: var(--ink);
  box-shadow: var(--shadow-1);
}
.iconbtn {
  border: 1px solid var(--border); background: var(--surface);
  border-radius: 7px; width: 32px; height: 30px; cursor: pointer;
  display: grid; place-items: center; color: var(--ink-2);
}
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }

/* ============================================================
   Step rail
   ============================================================ */
.railwrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px 10px;
}
.steprail {
  display: flex; align-items: stretch; gap: 6px;
  overflow-x: auto; padding-bottom: 2px;
  scrollbar-width: thin;
}
.stepchip {
  --c: var(--border-2);
  flex: 1 1 0; min-width: 118px;
  display: flex; flex-direction: column; gap: 3px;
  padding: 8px 10px 9px;
  border: 0; border-top: 2px solid var(--c);
  background: transparent; text-align: left; cursor: pointer;
  border-radius: 0 0 4px 4px;
  transition: background .15s ease;
}
.stepchip:hover { background: var(--surface-2); }
.stepchip .k {
  font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
  color: var(--ink-3);
}
.stepchip .t { font-size: 12.5px; font-weight: 560; color: var(--ink-3); line-height: 1.25; }
.stepchip[data-state="done"] { --c: var(--accent); }
.stepchip[data-state="done"] .t { color: var(--ink-2); }
.stepchip[data-state="done"] .k { color: var(--accent); }
.stepchip[data-state="current"] { --c: var(--accent); background: var(--accent-soft); }
.stepchip[data-state="current"] .t { color: var(--ink); font-weight: 640; }
.stepchip[data-state="current"] .k { color: var(--accent); }

/* ============================================================
   Mail shell
   ============================================================ */
.shell {
  display: grid;
  grid-template-columns: var(--rail-w) var(--list-w) minmax(0, 1fr) var(--trace-w);
  min-height: 0;
  background: var(--paper);
}
.col { min-width: 0; min-height: 0; overflow: auto; }

/* --- folder rail --- */
.rail { padding: 14px 10px; border-right: 1px solid var(--border); background: var(--surface-2); }
.compose-cta {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; margin-bottom: 14px;
  border: 1px solid var(--border-2); border-radius: 7px;
  background: var(--surface); cursor: default;
  font-size: 13px; font-weight: 560; color: var(--ink-2);
  box-shadow: var(--shadow-1);
}
.railgroup { margin-bottom: 16px; }
.railhead {
  font-size: 10.5px; font-weight: 640; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-3); padding: 0 8px 6px;
}
.folder {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 6px;
  font-size: 13px; color: var(--ink-2);
}
.folder .cnt { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.folder[data-active="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.folder[data-active="true"] .cnt { color: var(--accent); font-weight: 640; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--border-2); }
.folder[data-active="true"] .dot { background: var(--accent); }

/* --- message list --- */
.list { border-right: 1px solid var(--border); background: var(--surface); }
.listhead {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: baseline; gap: 8px;
  padding: 12px 14px 10px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.listhead h2 { margin: 0; font-size: 14px; font-weight: 640; letter-spacing: -.01em; }
.listhead .meta { font-size: 11.5px; color: var(--ink-3); margin-left: auto; }

.msg {
  display: block; width: 100%; text-align: left;
  padding: 11px 14px 12px 12px;
  border: 0; border-bottom: 1px solid var(--border);
  border-left: 3px solid transparent;
  background: transparent; cursor: default;
  animation: slidein .28s ease both;
}
.msg[data-open="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.msg[data-unread="true"] .subj { font-weight: 680; color: var(--ink); }
.msg .row1 { display: flex; align-items: baseline; gap: 8px; }
.msg .from { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.msg[data-unread="true"] .from { color: var(--ink); }
.msg .time { margin-left: auto; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.msg .subj { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.msg .prev {
  font-size: 12px; color: var(--ink-3); margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.msg .flags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px; border-radius: 20px;
  font-size: 10.5px; font-weight: 640; letter-spacing: .02em;
  border: 1px solid transparent;
}
.tag-agent { background: var(--accent-soft); color: var(--accent); }
.tag-lock  { background: var(--seal-soft); color: var(--seal); }
.tag-ok    { background: var(--ok-soft); color: var(--ok); }
.tag-warn  { background: var(--warn-soft); color: var(--warn); }
.tag-plain { background: var(--surface-3); color: var(--ink-2); }

/* --- reading pane --- */
.pane { background: var(--surface); }
.paneinner { padding: 20px 26px 40px; max-width: 760px; animation: fadein .3s ease both; }

.emailhead { padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.emailhead h1 {
  margin: 0 0 12px; font-size: 19px; line-height: 1.3; font-weight: 640;
  letter-spacing: -.015em; text-wrap: balance;
}
.idline { display: flex; align-items: flex-start; gap: 10px; }
.avatar {
  width: 34px; height: 34px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 660; letter-spacing: .02em;
  background: var(--surface-3); color: var(--ink-2);
}
.avatar[data-kind="agent"] { background: var(--accent); color: var(--surface); }
:root[data-theme="dark"] .avatar[data-kind="agent"] { color: #0D1218; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .avatar[data-kind="agent"] { color: #0D1218; } }
.idmeta { min-width: 0; flex: 1; }
.idmeta .nm { font-size: 13.5px; font-weight: 620; }
.idmeta .ad { font-size: 12px; color: var(--ink-3); font-family: var(--mono); }
.idmeta .to { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.stamp { margin-left: auto; text-align: right; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

.body {
  font-family: var(--serif);
  font-size: 15.5px; line-height: 1.68;
  color: var(--ink);
  padding: 18px 0 4px;
  max-width: 64ch;
}
.body p { margin: 0 0 14px; }
.body ul, .body ol { margin: 0 0 14px; padding-left: 20px; }
.body li { margin-bottom: 5px; }
.body .sig { color: var(--ink-3); font-size: 14px; }
.body strong { font-weight: 640; }

/* parsed-request highlights */
.sl {
  background: transparent; color: inherit;
  border-radius: 2px; padding: 1px 0;
  transition: background .25s ease, box-shadow .25s ease;
}
.hl .sl {
  padding: 1px 3px; margin: 0 -1px;
  box-shadow: inset 0 -2px 0 var(--sc);
  background: var(--sb);
}
.sl[data-slot="entity"] { --sc: var(--slot-entity); --sb: var(--slot-entity-bg); }
.sl[data-slot="id"]     { --sc: var(--slot-id);     --sb: var(--slot-id-bg); }
.sl[data-slot="scope"]  { --sc: var(--slot-scope);  --sb: var(--slot-scope-bg); }
.sl[data-slot="out"]    { --sc: var(--slot-out);    --sb: var(--slot-out-bg); }
.hl .sl::after {
  content: attr(data-tag);
  font-family: var(--mono); font-size: 8.5px; font-weight: 700;
  letter-spacing: .04em; vertical-align: super;
  color: var(--sc); margin-left: 2px;
}

.legend {
  display: flex; flex-wrap: wrap; gap: 6px 14px;
  padding: 10px 12px; margin: 4px 0 16px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2);
  font-size: 11.5px; color: var(--ink-2);
}
.legend .li { display: flex; align-items: center; gap: 6px; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.legend .hint { margin-left: auto; color: var(--ink-3); }

/* --- cards inside the pane --- */
.card {
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface-2);
  margin: 16px 0;
  overflow: hidden;
}
.card > header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  font-size: 12px; font-weight: 640; letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2);
}
.card > header .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 560; color: var(--ink-3); }
.card .cbody { padding: 14px; }
.card.seal { border-color: var(--seal); }
.card.seal > header { color: var(--seal); background: var(--seal-soft); border-bottom-color: var(--seal); }

.kv { display: grid; grid-template-columns: minmax(120px, auto) 1fr; gap: 7px 16px; font-size: 13px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; color: var(--ink); }
.kv dd.mono, .mono { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }

.checks { display: flex; flex-direction: column; gap: 8px; }
.check { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; }
.check .bx {
  width: 15px; height: 15px; flex: none; margin-top: 2px; border-radius: 4px;
  border: 1.5px solid var(--border-2); display: grid; place-items: center;
  font-size: 9px; color: transparent;
}
.check[data-on="true"] .bx { background: var(--ok); border-color: var(--ok); color: var(--surface); }
:root[data-theme="dark"] .check[data-on="true"] .bx { color: #0D1218; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .check[data-on="true"] .bx { color: #0D1218; } }
.check .sub { display: block; color: var(--ink-3); font-size: 12px; }

/* attachment chip */
.attachbar { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 0 4px; border-top: 1px solid var(--border); margin-top: 18px; }
.attach {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 14px 10px 11px;
  border: 1px solid var(--border-2); border-radius: 9px;
  background: var(--surface); box-shadow: var(--shadow-1);
  min-width: 268px;
}
.attach .ficon {
  width: 34px; height: 40px; flex: none; border-radius: 4px;
  background: var(--ok); color: var(--surface);
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .04em;
  position: relative;
}
:root[data-theme="dark"] .attach .ficon { color: #0D1218; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .attach .ficon { color: #0D1218; } }
.attach .ficon::after {
  content: "\1F512"; position: absolute; right: -7px; bottom: -6px;
  font-size: 13px; line-height: 1;
  filter: grayscale(1) brightness(.55);
}
.attach .fn { font-size: 12.5px; font-weight: 620; word-break: break-all; }
.attach .fm { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* workbook viewer */
.wb { border: 1px solid var(--border-2); border-radius: 10px; overflow: hidden; background: var(--surface); margin: 16px 0; box-shadow: var(--shadow-1); }
.wbbar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--ink-2);
}
.wbbar .nm { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
.wbstage { position: relative; min-height: 232px; }
.lockscrim {
  position: absolute; inset: 0; z-index: 3;
  display: grid; place-items: center; padding: 20px;
  background: var(--surface-2);
  text-align: center;
}
.lockscrim .lk { font-size: 26px; line-height: 1; filter: grayscale(1); }
.lockscrim h4 { margin: 10px 0 4px; font-size: 14px; font-weight: 640; }
.lockscrim p { margin: 0 0 14px; font-size: 12.5px; color: var(--ink-3); max-width: 42ch; }
.pwrow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.pwrow input {
  font: inherit; font-family: var(--mono); font-size: 12.5px;
  padding: 7px 10px; width: 210px;
  border: 1px solid var(--border-2); border-radius: 7px;
  background: var(--surface); color: var(--ink);
}
.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
  padding: 7px 14px; border-radius: 7px; cursor: pointer;
  font-size: 12.5px; font-weight: 620;
}
:root[data-theme="dark"] .btn { color: #0D1218; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0D1218; } }
.btn:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--border-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.pwerr { margin-top: 10px; font-size: 12px; color: var(--seal); min-height: 16px; }

.sheettabs { display: flex; gap: 2px; padding: 6px 8px 0; background: var(--surface-2); border-bottom: 1px solid var(--border); overflow-x: auto; }
.sheettab {
  border: 1px solid transparent; border-bottom: 0; background: transparent;
  padding: 5px 11px; border-radius: 6px 6px 0 0; cursor: pointer;
  font-size: 11.5px; color: var(--ink-3); white-space: nowrap;
}
.sheettab:hover { color: var(--ink); }

          { s: "done", l: "Workbook built", d: "8 sheets · 412 KB" },

        ]) + notecard("Why not put the password in the email?", "Because then the lock and the key travel together. Splitting them across two channels is the whole point — and it is why the company path needs a delivery step the person path does not.");
      },
      sub: "KYC-2481 · encrypted · AES-256"
    },

    { k: "Deliver",
      t: "Send, then unlock",

      list: ["coDone", "coAck", "noise1", "noise2"],
      listTitle: "Inbox",

      narr: "The file lands in the analyst's inbox locked. The password arrived on Teams a minute earlier — paste it in below to open the workbook and page through the sheets.",

      },
      trace: function (st) {

          { s: "done", l: "Encrypted", d: "AES-256 · 418 KB" },
          { s: "done", l: "Password delivered", d: "Teams · 09:33 · read receipt" },

          { s: st.unlocked ? "done" : "active", l: st.unlocked ? "Recipient opened the file" : "Awaiting recipient open", d: st.unlocked ? "09:36 · logged against KYC-2481" : "access is logged when it happens" }

        notecard("Password (demo)", 'On a real desk this arrives on Teams. Here it is: <span class="mono">' + PASSWORD + '</span> — or press <b>Paste from Teams</b> on the locked workbook.') +
        notecard("Still just a mailbox", "The analyst has not opened a single internal tool. Request, confirmation, data and delivery all happened in one email thread.");
      },
      sub: function (st) { return st.unlocked ? "KYC-2481 · delivered · opened" : "KYC-2481 · delivered · locked"; }

    { k: "Converse",
      t: "Reply in plain English",
      folder: "inbox",
      list: ["coDelta", "coFup", "coDone", "coAck"],
      listTitle: "Inbox",
      open: "coDelta",
      hl: true,
      narr: "The analyst answers the way they would answer a colleague. The agent highlights the new asks inside the reply, runs only the delta, and sends an addendum workbook under the same password.",
      diff: "<b>Same conversation, same encryption rule.</b> Any follow-up that produces rows rather than a verdict comes back encrypted too — the guide, not the analyst, decides when a spreadsheet is required.",
      pane: function () {
        return head({ from: AGENT, to: "Amelia Chen", subject: "Re: New counterparty — Shanghai Dingxin — addendum attached (encrypted)", time: "Tue 28 Jul, 10:19", extra: "KYC-2481-A · addendum" }) +

          '<div class="attachbar">' +
            '<div class="attach"><div class="ficon">XLSX</div><div><div class="fn">' + DELTA_FILENAME + '</div><div class="fm">96 KB · encrypted · same password</div></div></div>' +

          '<div class="quoted">' +
            '<div class="qh">On Tue 28 Jul at 10:02, Amelia Chen wrote:</div>' +

            sl("scope", "CHK", "litigation") + ' for ' + sl("entity", "ORG", "the two subsidiaries") + ' as well? ' + sl("out", "SEC", "Same encryption please") + '.</p>' +

  var PERSON_STEPS = [

    { k: "Compose",
      t: "Write the request",
      folder: "sent",
      list: ["noise1", "noise2"],
      listTitle: "Inbox",
      narr: "Same mailbox, same plain English. Nothing in how the analyst writes signals which guide will run — that is the agent's job to work out.",
      pane: function () {
        return '<div class="compose">' +
          '<header><span aria-hidden="true">&#9998;</span> New message</header>' +
          '<div class="cfield"><span class="lb">To</span><span class="vl">kyc-agent@meridiantrust.example</span></div>' +

          { s: "done", l: "Slots extracted", d: "8 of 8 required" },
          { s: "active", l: "Guide selected", d: "Person Search v3.8" }
        ]) + slotcard(PERSON_SLOTS);

    },

    { k: "Confirm",
      t: "Agent confirms scope",
      folder: "inbox",
      list: ["peAck", "noise1", "noise2"],
      listTitle: "Inbox",
      open: "peAck",
      narr: "The confirmation looks familiar, but read the delivery block: no attachment, no password, nothing exported. The screening outcome stays inside the thread.",
      diff: "<b>Delivery differs, not the conversation.</b> Company Search promises an encrypted workbook and a password on Teams. Person Search promises five lines in the reply.",
      pane: function () {
        return head({ from: AGENT, to: "Amelia Chen", subject: "Re: Screening — Wang Zhiming (legal rep, Dingxin file)", time: "Tue 28 Jul, 09:41", extra: "Auto-reply · KYC-2482" }) + ackBody("person");
      },
      trace: function () {
        return tsteps([
          { s: "done", l: "Guide selected", d: "Person Search v3.8" },
          { s: "done", l: "Job created", d: "KYC-2482 · linked to KYC-2481" },
          { s: "done", l: "Scope confirmation sent", d: "09:41:18" },
          { s: "active", l: "Screening" }
        ]) + notecard("No export, by design", "Bulk personal data leaving the platform is the thing worth controlling. A five-line verdict in an email is not a bulk export — so no file, no encryption, no password to manage.");
      },

    },

    { k: "Screen",
      t: "Run the screening",
      folder: "inbox",
      list: ["peAck", "noise1", "noise2"],
      listTitle: "Inbox",
      open: "peAck",
      narr: "Five sources, one subject, a handful of results. This is the volume difference that drives everything downstream — there is no dataset here to hand over.",
      pane: function () {
        return head({ from: AGENT, to: "Amelia Chen", subject: "Re: Screening — Wang Zhiming (legal rep, Dingxin file)", time: "Tue 28 Jul, 09:41", extra: "Auto-reply · KYC-2482" }) +
          '<div class="body">' +
          '<div class="card"><header>Screening in progress<span class="right">KYC-2482</span></header><div class="cbody">' +
            '<dl class="kv">' +
              '<dt>Sources queried</dt><dd class="mono">4 of 5</dd>' +
              '<dt>Records collected</dt><dd class="mono">6</dd>' +
              '<dt>Items needing review</dt><dd class="mono">1</dd>' +
            '</dl>' +
            '<div class="meter"><i style="width:78%"></i></div>' +
          '</div></div>' +
          '<p>Six records against 318 on the company file. That gap is why one comes back as an email and the other as a spreadsheet.</p>' +
          '</div>';
      },
      trace: function () {
        return tsteps([
          { s: "done", l: "Job created", d: "KYC-2482" },
          { s: "active", l: "Screening", d: "6 records · 1 to review" },
          { s: "wait", l: "Compose verdict" },
          { s: "wait", l: "Send inline reply" }
        ]) + srccard([
          { n: "Identity verification", c: "Name + DOB + ID last-4", s: "ok", t: "verified" },
          { n: "PEP lists · PRC + international", c: "Domestic, foreign, RCA", s: "ok", t: "no match" },
          { n: "Sanctions consolidated", c: "OFAC / EU / UK / UN", s: "ok", t: "no match" },
          { n: "中国裁判文书网", c: "As party and as legal rep", s: "hit", t: "1 linked" },
          { n: "Adverse media CN + EN", c: "Last 5 years", s: "run", t: "running" }
        ], 78);
      },
      sub: "KYC-2482 · screening · 6 records"
    },

    { k: "Answer",
      t: "Answer in the email",
      folder: "inbox",
      list: ["peDone", "peAck", "noise1", "noise2"],
      listTitle: "Inbox",
      open: "peDone",
      narr: "The result is written into the body as a short table. Nothing to download, nothing to decrypt, nothing sitting in a downloads folder afterwards.",
      diff: "<b>Side by side.</b> Company Search: 318 records → 8-sheet workbook → AES-256 → password on Teams → expires in 14 days. Person Search: 6 records → 5 lines in the reply → nothing leaves the thread.",
      pane: function () {
        return head({ from: AGENT, to: "Amelia Chen", subject: "Re: Screening — Wang Zhiming — cleared with one item to review", time: "Tue 28 Jul, 09:48", extra: "KYC-2482 · complete" }) +
          '<div class="body">' +
          '<p>Screening complete for <strong>Wang Zhiming 王志明</strong>, born 12 April 1979, PRC national.</p>' +
          '<div class="gridwrap"><table class="res"><thead><tr><th>Check</th><th>Result</th><th>Detail</th></tr></thead><tbody>' +
            '<tr><td>Identity</td><td class="v">Verified</td><td>Name, DOB and ID last-4 consistent across three registry records</td></tr>' +
            '<tr><td>PEP</td><td class="v">Not a PEP</td><td>No domestic, foreign or close-associate match</td></tr>' +
            '<tr><td>Sanctions</td><td class="v">No match</td><td>OFAC, EU, UK, UN consolidated — checked 09:44</td></tr>' +
            '<tr><td>Court records</td><td class="v">1 to review</td><td>Named as legal representative on the 2024 Dingxin enforcement (RMB 1.24m, satisfied Nov 2024). No personal judgment.</td></tr>' +
            '<tr><td>Adverse media</td><td class="v">Clear</td><td>No relevant CN or EN coverage in the last five years</td></tr>' +
          '</tbody></table></div>' +
          '<p><strong>Assessment:</strong> low risk as an individual. The single item is corporate, already on the Dingxin file, and does not attach to him personally.</p>' +
          '<p>No attachment on this one — you asked for a short answer, and a screening verdict does not need a spreadsheet. Full evidence sits against KYC-2482 if second line wants it.</p>' +
          '<p class="sig">KYC Desk Agent</p>' +
          '</div>';
      },
      trace: function () {
        return tsteps([
          { s: "done", l: "Screening complete", d: "5 of 5 sources · 6 records" },
          { s: "done", l: "Verdict composed", d: "low risk · 1 item flagged" },
          { s: "done", l: "Inline reply sent", d: "09:48:31 · no attachment" },
          { s: "done", l: "Evidence retained", d: "case file KYC-2482 · not exported" }
        ]) + notecard("Two guides, one difference that matters", "<b>Person:</b> verdict → email body → no file.<br><b>Company:</b> dataset → xlsx → AES-256 → password out-of-band → 14-day expiry.");
      },
      sub: "KYC-2482 · answered inline"
    },

    { k: "Converse",
      t: "Reply in plain English",
      folder: "inbox",
      list: ["peDelta", "peFup", "peDone", "peAck"],
      listTitle: "Inbox",
      open: "peDelta",
      hl: true,
      narr: "The follow-up is a fragment — no name, no date of birth, just “he”. The agent carries the subject from the thread and answers in seconds, still with no attachment.",
      pane: function () {
        return head({ from: AGENT, to: "Amelia Chen", subject: "Re: Screening — Wang Zhiming — HK/Macau PEP check", time: "Tue 28 Jul, 09:57", extra: "KYC-2482-A" }) +
          '<div class="body">' +
          '<p>No PEP match in Hong Kong or Macau.</p>' +
          '<ul>' +
            '<li><strong>Hong Kong</strong> — no match on SFC licensed persons, no public-office record, three dormant directorships (all Dingyuan group).</li>' +
            '<li><strong>Macau</strong> — no match in the official gazette appointment lists.</li>' +
          '</ul>' +
          '<p>Assessment is unchanged: low risk. KYC-2482 updated.</p>' +
          '<div class="quoted">' +
            '<div class="qh">On Tue 28 Jul at 09:55, Amelia Chen wrote:</div>' +
            '<p>Thanks. Is ' + sl("entity", "PER", "he") + ' a ' + sl("scope", "CHK", "PEP") + ' anywhere ' + sl("id", "JUR", "outside the mainland") + ' — ' + sl("id", "JUR", "Hong Kong or Macau") + ' in particular?</p>' +
          '</div>' +
          '</div>';
      },
      trace: function () {
        return tsteps([
          { s: "done", l: "Reply parsed", d: "follow_up · confidence 0.91" },
          { s: "done", l: "Coreference resolved", d: "“he” → Wang Zhiming · from thread KYC-2482" },
          { s: "done", l: "Delta screening", d: "HK + Macau PEP · 2 sources" },
          { s: "done", l: "Inline reply sent", d: "09:57:44 · no attachment" }
        ]) + slotcard([
          { k: "entity", n: "subject", v: '<em>he</em> → Wang Zhiming (carried from thread)' },
          { k: "scope", n: "checks", v: '<em>PEP</em> only' },
          { k: "id", n: "jurisdiction", v: '<em>Hong Kong</em>, <em>Macau</em>' },
          { k: "out", n: "format", v: 'inline · unchanged from the thread' }
        ], "Parsed follow-up");
      },
      sub: "KYC-2482-A · answered inline"
    }
  ];

  /* ==========================================================
     State + render
     ========================================================== */
  var state = { track: "company", i: 0, unlocked: false, sheet: 0 };
  var lastKey = null;
  function steps() { return state.track === "company" ? COMPANY_STEPS : PERSON_STEPS; }

  var el = {
    rail: document.getElementById("steprail"),
    list: document.getElementById("msglist"),
    listTitle: document.getElementById("listTitle"),
    listMeta: document.getElementById("listMeta"),
    pane: document.getElementById("pane"),
    trace: document.getElementById("tracebody"),
    traceSub: document.getElementById("traceSub"),
    coachStep: document.getElementById("coachStep"),
    coachText: document.getElementById("coachText"),
    coachDiff: document.getElementById("coachDiff"),
    navCount: document.getElementById("navCount"),
    prev: document.getElementById("prevBtn"),
    next: document.getElementById("nextBtn"),
    restart: document.getElementById("restartBtn"),
    fInbox: document.getElementById("fInbox"),
    fSent: document.getElementById("fSent"),
    cInbox: document.getElementById("cInbox"),
    cSent: document.getElementById("cSent")
  };

  function render() {
    var S = steps(), s = S[state.i];

    /* step rail */
    var rail = "";
    S.forEach(function (st, i) {
      var stt = i < state.i ? "done" : (i === state.i ? "current" : "todo");
      rail += '<button type="button" class="stepchip" role="tab" data-i="' + i + '" data-state="' + stt + '" aria-selected="' + (i === state.i) + '">' +
        '<span class="k">' + String(i + 1).padStart(2, "0") + ' &middot; ' + st.k + '</span>' +
        '<span class="t">' + st.t + '</span></button>';
    });
    el.rail.innerHTML = rail;

    /* folders */
    var inboxSel = s.folder !== "sent";
    el.fInbox.setAttribute("data-active", String(inboxSel));
    el.fSent.setAttribute("data-active", String(!inboxSel));
    var unread = s.list.filter(function (k) { return M[k].unread && k !== s.open; }).length;
    el.cInbox.textContent = s.folder === "sent" ? "2" : String(unread || s.list.length);
    el.cSent.textContent = state.i === 0 ? "0" : "1";

    /* list */
    el.listTitle.textContent = s.listTitle;
    el.listMeta.textContent = s.list.length + (s.list.length === 1 ? " message" : " messages");
    el.list.innerHTML = s.list.map(function (k) { return msgHTML(k, s.open); }).join("");

    /* pane — on a step change reset the scroll container, otherwise the
       previous step's offset hides the subject line of the next email.
       In-step re-renders (sheet tabs, unlocking) keep their position. */
    el.pane.innerHTML = s.pane(state);
    var key = state.track + ":" + state.i;
    if (key !== lastKey) {
      lastKey = key;
      el.pane.parentElement.scrollTop = 0;
      el.list.parentElement.scrollTop = 0;
    }
    el.pane.classList.toggle("hl", !!s.hl);
    var bodies = el.pane.querySelectorAll(".body");
    for (var b = 0; b < bodies.length; b++) bodies[b].classList.toggle("hl", !!s.hl);

    /* trace */
    el.trace.innerHTML = s.trace(state);
    el.traceSub.textContent = typeof s.sub === "function" ? s.sub(state) : s.sub;

    /* coach */
    el.coachStep.textContent = "Step " + (state.i + 1) + " of " + S.length + " · " + (state.track === "company" ? "Company search" : "Person search");
    el.coachText.textContent = s.narr;
    if (s.diff) { el.coachDiff.innerHTML = s.diff; el.coachDiff.hidden = false; }
    else { el.coachDiff.hidden = true; }

    el.navCount.textContent = (state.i + 1) + " / " + S.length;
    el.prev.disabled = state.i === 0;
    el.next.disabled = state.i === S.length - 1;

    wire();
  }

  /* interactions inside freshly rendered content */
  function wire() {
    var go = document.getElementById("pwGo");
    var inp = document.getElementById("pwInput");
    var paste = document.getElementById("pwPaste");
    var err = document.getElementById("pwErr");

    function attempt() {
      if (!inp) return;
      if (inp.value.trim() === PASSWORD) { state.unlocked = true; render(); }
      else {
        err.textContent = inp.value.trim()
          ? "That password does not open this workbook. It was issued per file — check the Teams message."
          : "Enter the password from the Teams message, or use Paste from Teams.";
        inp.focus();
      }
    }
    if (go) go.addEventListener("click", attempt);
    if (inp) inp.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
    if (paste) paste.addEventListener("click", function () { inp.value = PASSWORD; err.textContent = ""; attempt(); });

    var tabs = document.querySelectorAll(".sheettab");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener("click", function (e) {
        state.sheet = Number(e.currentTarget.getAttribute("data-sheet"));
        render();
      });
    }

    var send = document.getElementById("sendFake");
    if (send) send.addEventListener("click", function () { step(1); });

    var chips = document.querySelectorAll(".stepchip");
    for (var j = 0; j < chips.length; j++) {
      chips[j].addEventListener("click", function (e) {
        state.i = Number(e.currentTarget.getAttribute("data-i"));
        render();
      });
    }
  }

  function step(d) {
    var S = steps();
    state.i = Math.max(0, Math.min(S.length - 1, state.i + d));
    render();
  }

  function setTrack(t) {
    state.track = t;
    state.i = 0; state.unlocked = false; state.sheet = 0;
    document.getElementById("trackCompany").setAttribute("aria-pressed", String(t === "company"));
    document.getElementById("trackPerson").setAttribute("aria-pressed", String(t === "person"));
    render();
  }

  el.next.addEventListener("click", function () { step(1); });
  el.prev.addEventListener("click", function () { step(-1); });
  el.restart.addEventListener("click", function () { state.i = 0; state.unlocked = false; state.sheet = 0; render(); });
  document.getElementById("trackCompany").addEventListener("click", function () { setTrack("company"); });
  document.getElementById("trackPerson").addEventListener("click", function () { setTrack("person"); });

  document.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") { step(1); }
    else if (e.key === "ArrowLeft") { step(-1); }
  });

  /* theme toggle */
  var themeBtn = document.getElementById("themeBtn");
  themeBtn.addEventListener("click", function () {
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme");
    if (!cur) cur = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });

  render();
})();
</script>
