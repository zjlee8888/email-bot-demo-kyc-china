<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fill Easy — Individual KYC by Email</title>
<meta name="description" content="Interactive demo: fill the Background Screening Orders workbook, encrypt it, email it to the Fill Easy agent, and get verification results back — all in plain language.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B5C63">
<!-- ARTIFACT:STYLE:BEGIN -->
<style>
/* ============================================================
   Tokens — petrol primary, amber reserved for encryption state
   ============================================================ */
:root {
  color-scheme: light dark;

  --paper:      #ECF1F1;
  --surface:    #FFFFFF;
  --surface-2:  #F4F7F7;
  --surface-3:  #E3EAEA;
  --border:     #D5DEDF;
  --border-2:   #BDCACB;
  --ink:        #101A1C;
  --ink-2:      #415356;
  --ink-3:      #6B7C7F;

  --brand:      #0B5C63;
  --brand-2:    #08464C;
  --brand-soft: #DCEBEC;

  --gold:       #8A6108;
  --gold-soft:  #F7EBD2;
  --gold-line:  #E5C55A;
  --ok:         #2C6E49;
  --ok-soft:    #DEEDE3;
  --crit:       #A33A31;
  --crit-soft:  #F7E3E1;

  /* Fill Easy agent notification block */
  --fe-bar:     #1C1C1C;
  --fe-bar-tx:  #FFFFFF;
  --fe-cell:    #FFFFFF;
  --fe-head:    #F7F8F8;
  --fe-line:    #DDE1E2;
  --fe-tx:      #1C1C1C;
  --fe-mut:     #6E7679;
  --fe-yellow:  #FFF4C2;
  --fe-red:     #C0392B;

  /* parsed-request slot categories */
  --s-subj: #0B5C63; --s-subj-bg: #DCEBEC;
  --s-id:   #6A4A9C; --s-id-bg:   #E7E0F3;
  --s-fld:  #2C6E49; --s-fld-bg:  #DEEDE3;
  --s-sec:  #8A6108; --s-sec-bg:  #F7EBD2;

  --sh-1: 0 1px 2px rgba(16,26,28,.07);
  --sh-2: 0 10px 28px rgba(16,26,28,.12), 0 2px 6px rgba(16,26,28,.06);

  --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;

  --r-sm: 6px; --r: 10px; --r-lg: 14px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:#0B1113; --surface:#131B1D; --surface-2:#182225; --surface-3:#202C2F;
    --border:#273538; --border-2:#38494D; --ink:#E2EAEB; --ink-2:#A5B4B6; --ink-3:#78888B;
    --brand:#5FAAB1; --brand-2:#8AC6CB; --brand-soft:#123336;
    --gold:#D5A24A; --gold-soft:#2E2413; --gold-line:#6B551F;
    --ok:#6BB98C; --ok-soft:#152C20; --crit:#DE8B82; --crit-soft:#331D1B;
    --fe-bar:#000000; --fe-bar-tx:#FFFFFF;
    --fe-cell:#131B1D; --fe-head:#182225; --fe-line:#273538; --fe-tx:#E2EAEB; --fe-mut:#8B999C;
    --fe-yellow:#3A3216; --fe-red:#E08379;
    --s-subj:#5FAAB1; --s-subj-bg:#123336;
    --s-id:#AE96DE;   --s-id-bg:#241D33;
    --s-fld:#6BB98C;  --s-fld-bg:#152C20;
    --s-sec:#D5A24A;  --s-sec-bg:#2E2413;
    --sh-1: 0 1px 2px rgba(0,0,0,.45);
    --sh-2: 0 12px 32px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  --paper:#0B1113; --surface:#131B1D; --surface-2:#182225; --surface-3:#202C2F;
  --border:#273538; --border-2:#38494D; --ink:#E2EAEB; --ink-2:#A5B4B6; --ink-3:#78888B;
  --brand:#5FAAB1; --brand-2:#8AC6CB; --brand-soft:#123336;
  --gold:#D5A24A; --gold-soft:#2E2413; --gold-line:#6B551F;
  --ok:#6BB98C; --ok-soft:#152C20; --crit:#DE8B82; --crit-soft:#331D1B;
  --fe-bar:#000000; --fe-bar-tx:#FFFFFF;
  --fe-cell:#131B1D; --fe-head:#182225; --fe-line:#273538; --fe-tx:#E2EAEB; --fe-mut:#8B999C;
  --fe-yellow:#3A3216; --fe-red:#E08379;
  --s-subj:#5FAAB1; --s-subj-bg:#123336;
  --s-id:#AE96DE;   --s-id-bg:#241D33;
  --s-fld:#6BB98C;  --s-fld-bg:#152C20;
  --s-sec:#D5A24A;  --s-sec-bg:#2E2413;
  --sh-1: 0 1px 2px rgba(0,0,0,.45);
  --sh-2: 0 12px 32px rgba(0,0,0,.55);
}
:root[data-theme="light"] {
  --paper:#ECF1F1; --surface:#FFFFFF; --surface-2:#F4F7F7; --surface-3:#E3EAEA;
  --border:#D5DEDF; --border-2:#BDCACB; --ink:#101A1C; --ink-2:#415356; --ink-3:#6B7C7F;
  --brand:#0B5C63; --brand-2:#08464C; --brand-soft:#DCEBEC;
  --gold:#8A6108; --gold-soft:#F7EBD2; --gold-line:#E5C55A;
  --ok:#2C6E49; --ok-soft:#DEEDE3; --crit:#A33A31; --crit-soft:#F7E3E1;
  --fe-bar:#1C1C1C; --fe-bar-tx:#FFFFFF;
  --fe-cell:#FFFFFF; --fe-head:#F7F8F8; --fe-line:#DDE1E2; --fe-tx:#1C1C1C; --fe-mut:#6E7679;
  --fe-yellow:#FFF4C2; --fe-red:#C0392B;
  --s-subj:#0B5C63; --s-subj-bg:#DCEBEC;
  --s-id:#6A4A9C;   --s-id-bg:#E7E0F3;
  --s-fld:#2C6E49;  --s-fld-bg:#DEEDE3;
  --s-sec:#8A6108;  --s-sec-bg:#F7EBD2;
  --sh-1: 0 1px 2px rgba(16,26,28,.07);
  --sh-2: 0 10px 28px rgba(16,26,28,.12), 0 2px 6px rgba(16,26,28,.06);
}

/* ============================================================
   Base
   ============================================================ */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 3px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  height: 100dvh; min-height: 0;
}

/* ============================================================
   Brand bar
   ============================================================ */
.brandbar {
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  padding: 10px 18px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.logo {
  display: grid; place-items: center; width: 28px; height: 28px; flex: none;
  border-radius: var(--r-sm); background: var(--brand); color: #fff;
  font-size: 13px; font-weight: 700; letter-spacing: -.02em;
}
:root[data-theme="dark"] .logo { color: #0B1113; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo { color: #0B1113; } }
.brandname { font-weight: 660; letter-spacing: -.01em; min-width: 0; }
.brandsub {
  color: var(--ink-3); font-size: 12px;
  padding-left: 14px; border-left: 1px solid var(--border);
}
.brandbar .spacer { flex: 1; }
.iconbtn {
  border: 1px solid var(--border); background: var(--surface);
  border-radius: var(--r-sm); width: 32px; height: 31px; cursor: pointer;
  display: grid; place-items: center; color: var(--ink-2);
}
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }

/* ============================================================
   Stepper — this IS a real sequence, so it is numbered
   ============================================================ */
.stepwrap { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 18px 12px; }
.stepper { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.step {
  flex: 1 1 0; min-width: 132px;
  display: flex; align-items: flex-start; gap: 9px;
  padding: 9px 11px; border: 1px solid transparent; border-radius: var(--r-sm);
  background: transparent; text-align: left; cursor: pointer;
}
.step:hover { background: var(--surface-2); }
.step .n {
  width: 21px; height: 21px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
  border: 1.5px solid var(--border-2); color: var(--ink-3); background: var(--surface);
}
.step .t { font-size: 12.5px; font-weight: 560; color: var(--ink-3); line-height: 1.3; }
.step[data-state="done"] .n { background: var(--brand); border-color: var(--brand); color: #fff; }
.step[data-state="done"] .t { color: var(--ink-2); }
.step[data-state="current"] { background: var(--brand-soft); border-color: var(--brand); }
.step[data-state="current"] .n { background: var(--brand); border-color: var(--brand); color: #fff; }
.step[data-state="current"] .t { color: var(--ink); font-weight: 660; }
:root[data-theme="dark"] .step[data-state="done"] .n,
:root[data-theme="dark"] .step[data-state="current"] .n { color: #0B1113; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .step[data-state="done"] .n,
  :root:not([data-theme="light"]) .step[data-state="current"] .n { color: #0B1113; }
}

/* ============================================================
   Stage
   ============================================================ */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 336px; min-height: 0; }
.stage { min-width: 0; min-height: 0; overflow: auto; padding: 20px 22px 40px; }
.stageinner { max-width: 1000px; }

.side { min-width: 0; min-height: 0; overflow: auto; border-left: 1px solid var(--border); background: var(--surface-2); }
.sidehead {
  position: sticky; top: 0; z-index: 2; padding: 13px 15px 11px;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
}
.sidehead .ti { display: flex; align-items: center; gap: 8px; }
.sidehead h2 { margin: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); flex: none; }
.sidehead .sb { margin-top: 5px; font-size: 11.5px; color: var(--ink-3); font-family: var(--mono); word-break: break-word; }
.sidebody { padding: 15px; display: flex; flex-direction: column; gap: 14px; }

/* ============================================================
   Cards + form controls (the login-page component idiom)
   ============================================================ */
.card { border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); box-shadow: var(--sh-1); overflow: hidden; margin-bottom: 18px; }
.card > header {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding: 13px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2);
}
.card > header h3 { margin: 0; font-size: 14px; font-weight: 660; letter-spacing: -.005em; }
.card > header .right { margin-left: auto; font-size: 12px; color: var(--ink-3); }
.card .cb { padding: 16px; }
.card.gold { border-color: var(--gold-line); }
.card.gold > header { background: var(--gold-soft); border-bottom-color: var(--gold-line); }
.card.gold > header h3 { color: var(--gold); }

.lede { margin: 0 0 16px; font-size: 14.5px; color: var(--ink-2); max-width: 74ch; }
.lede strong { color: var(--ink); font-weight: 620; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field label .req { color: var(--crit); }
.field input, .field select, .field textarea {
  padding: 10px 12px; border: 1px solid var(--border-2); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink); font-size: 14px; width: 100%;
}
.field input:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.field .hint { font-size: 11.5px; color: var(--ink-3); }
.field .err { font-size: 11.5px; color: var(--crit); }
.field.mono input { font-family: var(--mono); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0 16px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid var(--brand); background: var(--brand); color: #fff;
  padding: 10px 18px; border-radius: var(--r-sm); cursor: pointer;
  font-size: 13.5px; font-weight: 640;
}
.btn:hover { background: var(--brand-2); border-color: var(--brand-2); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--border-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn.sm { padding: 6px 12px; font-size: 12.5px; }
.btn.block { width: 100%; }
:root[data-theme="dark"] .btn:not(.ghost) { color: #0B1113; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn:not(.ghost) { color: #0B1113; } }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 660;
  border: 1px solid transparent; white-space: nowrap;
}
.b-gold { background: var(--gold-soft); color: var(--gold); border-color: var(--gold-line); }
.b-ok   { background: var(--ok-soft); color: var(--ok); }
.b-brand{ background: var(--brand-soft); color: var(--brand); }
.b-crit { background: var(--crit-soft); color: var(--crit); }
.b-mut  { background: var(--surface-3); color: var(--ink-2); }

/* ============================================================
   Spreadsheet
   ============================================================ */
.xl { border: 1px solid var(--border-2); border-radius: var(--r); overflow: hidden; background: var(--surface); box-shadow: var(--sh-1); }
.xlbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding: 9px 13px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 12.5px; }
.xlbar .fn { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
.xltab { display: flex; gap: 3px; padding: 6px 9px 0; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.xltab span {
  padding: 5px 13px; border: 1px solid var(--border); border-bottom: 0;
  border-radius: var(--r-sm) var(--r-sm) 0 0; background: var(--surface);
  font-size: 11.5px; font-weight: 640; color: var(--ink);
}
.xlscroll { overflow-x: auto; }
table.sheet { border-collapse: separate; border-spacing: 0; font-size: 12px; min-width: 100%; }
table.sheet th, table.sheet td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px 9px; text-align: left; vertical-align: top; }
table.sheet thead th.ch {
  background: var(--surface-3); color: var(--ink-3); font-weight: 640;
  font-family: var(--mono); font-size: 10.5px; text-align: center; padding: 3px 6px;
  position: sticky; top: 0; z-index: 3;
}
table.sheet thead tr.hdr th {
  background: var(--brand-soft); color: var(--ink); font-weight: 620;
  min-width: 132px; max-width: 210px; white-space: normal;
  position: sticky; top: 20px; z-index: 3;
}
table.sheet thead tr.hdr th .en { display: block; font-size: 10.5px; font-weight: 500; color: var(--ink-3); margin-top: 1px; }
table.sheet thead tr.hdr th .req { color: var(--crit); }
table.sheet td.rn {
  background: var(--surface-3); color: var(--ink-3); font-family: var(--mono);
  font-size: 10.5px; text-align: center; font-weight: 640;
  position: sticky; left: 0; z-index: 2; min-width: 30px;
}
table.sheet th.corner { position: sticky; left: 0; z-index: 4; background: var(--surface-3); min-width: 30px; }
table.sheet td { background: var(--surface); white-space: nowrap; }
table.sheet tr.sample td { color: var(--ink-3); font-style: italic; }
table.sheet td.cell-edit { background: var(--surface); cursor: text; min-width: 132px; outline: none; }
table.sheet td.cell-edit:focus { box-shadow: inset 0 0 0 2px var(--brand); background: var(--brand-soft); }
table.sheet td.cell-edit:empty::before { content: attr(data-ph); color: var(--ink-3); opacity: .65; font-style: italic; }
table.sheet td.bad { box-shadow: inset 0 0 0 2px var(--crit); }
.xlnote { padding: 10px 13px; font-size: 11.5px; color: var(--ink-3); background: var(--surface-2); border-top: 1px solid var(--border); }
.xlnote b { color: var(--ink-2); }

.instr { margin: 16px 0 0; padding: 13px 15px; border: 1px dashed var(--border-2); border-radius: var(--r); background: var(--surface-2); font-size: 12.5px; color: var(--ink-2); }
.instr h4 { margin: 0 0 7px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.instr ol { margin: 0; padding-left: 18px; }
.instr li { margin-bottom: 4px; }
.instr .cn { color: var(--ink-3); }

/* validation checklist */
.vlist { display: flex; flex-direction: column; gap: 7px; }
.vrow { display: flex; align-items: flex-start; gap: 9px; font-size: 12.5px; }
.vrow .mk {
  width: 16px; height: 16px; flex: none; margin-top: 1px; border-radius: 50%;
  display: grid; place-items: center; font-size: 9px; font-weight: 800;
  background: var(--surface-3); color: var(--ink-3);
}
.vrow[data-ok="true"] .mk { background: var(--ok); color: #fff; }
.vrow[data-ok="false"] .mk { background: var(--crit-soft); color: var(--crit); }
:root[data-theme="dark"] .vrow[data-ok="true"] .mk { color: #0B1113; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .vrow[data-ok="true"] .mk { color: #0B1113; } }
.vrow .vt { min-width: 0; }
.vrow .vs { display: block; color: var(--ink-3); font-size: 11.5px; }

/* ============================================================
   Mail
   ============================================================ */
.mail { border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); box-shadow: var(--sh-1); overflow: hidden; }
.mailhead { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.mailhead h1 { margin: 0 0 11px; font-size: 17px; font-weight: 660; letter-spacing: -.012em; text-wrap: balance; }
.idline { display: flex; align-items: flex-start; gap: 11px; flex-wrap: wrap; }
.av { width: 33px; height: 33px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--surface-3); color: var(--ink-2); }
.av[data-fe="1"] { background: var(--fe-bar); color: #fff; }
.idmeta { min-width: 0; flex: 1; }
.idmeta .nm { font-size: 13px; font-weight: 640; }
.idmeta .ad, .idmeta .to { font-size: 11.5px; color: var(--ink-3); font-family: var(--mono); word-break: break-all; }
.idmeta .to { font-family: var(--sans); margin-top: 2px; }
.stamp { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mailbody { padding: 16px 18px; font-size: 14px; line-height: 1.65; }
.mailbody p { margin: 0 0 13px; }
.mailbody ul { margin: 0 0 13px; padding-left: 20px; }
.mailbody .sig { color: var(--ink-3); }

/* attachment row */
.attrow { display: flex; flex-wrap: wrap; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.att { display: flex; align-items: center; gap: 11px; padding: 9px 14px 9px 11px; border: 1px solid var(--border-2); border-radius: var(--r-sm); background: var(--surface); min-width: 250px; }
.att .fi {
  width: 31px; height: 37px; flex: none; border-radius: 3px; position: relative;
  display: grid; place-items: center; font-family: var(--mono); font-size: 8.5px; font-weight: 700; color: #fff;
  background: var(--ok);
}
.att .fi[data-k="txt"] { background: var(--ink-3); }
.att .fi[data-k="lock"] { background: var(--gold); }
:root[data-theme="dark"] .att .fi { color: #0B1113; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .att .fi { color: #0B1113; } }
.att .fn { font-size: 12.5px; font-weight: 620; word-break: break-all; }
.att .fm { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-top: 1px; }
.att.enc { border-color: var(--gold-line); background: var(--gold-soft); }

/* the encryption call-out — the thing to notice */
.encnote {
  display: flex; align-items: flex-start; gap: 10px;
  margin: 0 0 14px; padding: 11px 13px;
  border: 1px solid var(--gold-line); border-left-width: 3px; border-radius: 0 var(--r-sm) var(--r-sm) 0;
  background: var(--gold-soft); color: var(--ink); font-size: 12.5px; line-height: 1.5;
}
.encnote b { color: var(--gold); }
.encnote .lk { font-size: 15px; line-height: 1.2; flex: none; }

/* compose */
.cfield { display: flex; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--border); font-size: 13px; align-items: baseline; }
.cfield .lb { color: var(--ink-3); width: 58px; flex: none; font-size: 12px; }
.cfield .vl { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.cfield .vl.pl { font-family: var(--sans); font-size: 13.5px; }

    fileState: document.getElementById("fileState")

    var s = STEPS[state.i];

    el.stepper.innerHTML = STEPS.map(function (st, i) {

        '<span class="n">' + (i + 1) + '</span><span class="t">' + st.k + '</span></button>';
    }).join("");

    el.inner.innerHTML = s.stage();
    el.inner.classList.toggle("hl", !!s.hl);
    el.side.innerHTML = s.side();
    el.sideSub.textContent = typeof s.sub === "function" ? s.sub() : s.sub;

    el.coachStep.textContent = "Step " + (state.i + 1) + " of " + STEPS.length + " · " + s.k;
    el.coachText.textContent = s.narr;
    if (s.tip) { el.coachTip.innerHTML = s.tip; el.coachTip.hidden = false; } else { el.coachTip.hidden = true; }

    el.navCount.textContent = (state.i + 1) + " / " + STEPS.length;
    el.prev.disabled = state.i === 0;
    el.next.disabled = state.i === STEPS.length - 1;

    el.fileState.className = "badge " + (state.encrypted ? "b-gold" : (validation().pass ? "b-ok" : "b-mut"));
    el.fileState.innerHTML = state.encrypted ? "&#128274; Workbook encrypted" : (validation().pass ? "Row 3 ready" : "Template not filled");

    });

    if (fs) fs.addEventListener("click", function () {
      Object.keys(EDITABLE).forEach(function (i) { state.row[i] = FILLED[i]; });

    });

    /* encryption */
    var doEnc = document.getElementById("doEnc");
    if (doEnc) doEnc.addEventListener("click", function () {
      var a = document.getElementById("pw1").value.trim(), b = document.getElementById("pw2").value.trim();
      var err = document.getElementById("pwErr");
      if (!a) { err.textContent = "Enter a password to encrypt the workbook."; return; }
      if (a !== b) { err.textContent = "The two passwords do not match."; return; }
      state.pw = a; state.encrypted = true; render();
    });
    var gen = document.getElementById("genPw");
    if (gen) gen.addEventListener("click", function () {
      document.getElementById("pw1").value = DESK_PW;
      document.getElementById("pw2").value = DESK_PW;
      document.getElementById("pwErr").textContent = "";
    });
    var un = document.getElementById("unencrypt");
    if (un) un.addEventListener("click", function () { state.encrypted = false; state.unlocked = false; render(); });

    /* send */
    var sb = document.getElementById("sendBtn");
    if (sb) sb.addEventListener("click", function () { state.sent = true; state.i = Math.min(STEPS.length - 1, state.i + 1); render(); });

    /* open results workbook */
    var og = document.getElementById("openGo"), oi = document.getElementById("openPw"), oe = document.getElementById("openErr");
    function tryOpen() {
      if (!oi) return;
      if (state.pw && oi.value.trim() === state.pw) { state.unlocked = true; render(); }
      else { oe.textContent = oi.value.trim() ? "That password does not open this workbook." : "Enter the password you set in step 2."; oi.focus(); }
    }
    if (og) og.addEventListener("click", tryOpen);
    if (oi) oi.addEventListener("keydown", function (e) { if (e.key === "Enter") tryOpen(); });
    var oh = document.getElementById("openHint");
    if (oh) oh.addEventListener("click", function () { oi.value = state.pw || DESK_PW; tryOpen(); });
  }

  function step(d) { state.i = Math.max(0, Math.min(STEPS.length - 1, state.i + d)); render(); }
  el.next.addEventListener("click", function () { step(1); });
  el.prev.addEventListener("click", function () { step(-1); });
  el.restart.addEventListener("click", function () {
    state = { i: 0, row: FILLED.slice(), pw: "", encrypted: false, sent: false, unlocked: false, touched: false };
    Object.keys(EDITABLE).forEach(function (i) { state.row[i] = ""; });
    lastKey = null; render();
  });

  document.addEventListener("keydown", function (e) {
    if (e.target && (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable)) return;
    if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
  });

  document.getElementById("themeBtn").addEventListener("click", function () {
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    if (!cur) cur = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    r.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });

  render();
})();
</script>
